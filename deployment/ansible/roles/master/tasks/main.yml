---
# tasks file for roles/master

- name: Créer le fichier de configuration kubeadm
  copy:
    dest: /etc/kubernetes/kubeadm-config.yaml
    content: |
      apiVersion: kubeadm.k8s.io/v1beta3
      kind: ClusterConfiguration
      kubernetesVersion: "v1.31.0"
      networking:
        podSubnet: "10.244.0.0/16"
      controllerManager:
        extraArgs:
          cloud-provider: external
      ---
      apiVersion: kubeadm.k8s.io/v1beta3
      kind: InitConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          cloud-provider: external

- name: Initialiser le cluster
  command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  args:
    creates: /etc/kubernetes/admin.conf

- name: Créer dossier kube
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copier admin.conf pour ubuntu
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: yes
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Créer dossier kube pour ansible
  file:
    path: /home/ansible/.kube
    state: directory
    owner: ansible
    group: ansible
    mode: '0755'

- name: Copier admin.conf pour ansible
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ansible/.kube/config
    remote_src: yes
    owner: ansible
    group: ansible
    mode: '0600'

- name: Installer Flannel
  command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Générer token
  command: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Sauvegarder commande
  copy:
    content: "{{ join_command.stdout }}\n"
    dest: "{{ playbook_dir }}/roles/worker/files/join-command.sh"
    mode: '0600'
  delegate_to: localhost
  become: false
