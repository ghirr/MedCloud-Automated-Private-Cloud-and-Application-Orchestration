heat_template_version: 2018-08-31

description: >
  Scenario 1/3 - Deploy a single instance on the existing selfservice network.

parameters:
  key_name:
    type: string
    description: Name of an existing key pair for SSH access
    default: my-key
    constraints:
      - custom_constraint: nova.keypair

  image_id:
    type: string
    description: Image to use for the instance
    default: ubuntu-22.04
    constraints:
      - custom_constraint: glance.image

  flavor:
    type: string
    description: Flavor for the instance
    default: m1.medium
    constraints:
      - custom_constraint: nova.flavor

  network:
    type: string
    description: Existing internal network name
    default: selfservice

resources:

  # ── Security Group ────────────────────────────────────────
  security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: heat-sg-scenario1
      description: Allow SSH and ICMP
      rules:
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
          remote_ip_prefix: 0.0.0.0/0
        - protocol: icmp
          remote_ip_prefix: 0.0.0.0/0

  # ── Port ──────────────────────────────────────────────────
  instance_port:
    type: OS::Neutron::Port
    depends_on: security_group
    properties:
      network: { get_param: network }
      security_groups:
        - { get_resource: security_group }

  # ── Instance ──────────────────────────────────────────────
  instance:
    type: OS::Nova::Server
    depends_on: instance_port
    properties:
      name: heat-instance-scenario1
      image: { get_param: image_id }
      flavor: { get_param: flavor }
      key_name: { get_param: key_name }
      networks:
        - port: { get_resource: instance_port }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        echo "Heat Scenario 1 - Instance deployed successfully" > /etc/motd

outputs:
  instance_id:
    description: ID of the deployed instance
    value: { get_resource: instance }

  instance_name:
    description: Name of the deployed instance
    value: { get_attr: [instance, name] }

  private_ip:
    description: Private IP address of the instance
    value: { get_attr: [instance, first_address] }
